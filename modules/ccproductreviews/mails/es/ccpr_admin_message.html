<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Mensaje sobre tu reseña</title>
</head>
<body>
  <p>Hola <strong>{firstname} {lastname}</strong>,</p>

  <p>
    Te escribimos desde <strong>{shop_name}</strong> en relación con tu reseña del producto:
    <strong>{product_name}</strong>.
  </p>

  <p><strong>Mensaje:</strong></p>
  <div style="padding:12px;border:1px solid #eee;border-radius:6px;background:#fafafa;">
    {message}
  </div>

  <p>Gracias,<br>{shop_name}</p>
</body>
</html>
