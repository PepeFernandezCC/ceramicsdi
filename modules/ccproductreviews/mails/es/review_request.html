<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Valora tu pedido</title>
<style>
  body { margin:0; padding:0; background:#f6f6f6; font-family: Arial, Helvetica, sans-serif; }
  .container { max-width:600px; margin:40px auto; background:#ffffff; border-radius:6px; overflow:hidden; }
  .header { background:#111; color:#fff; padding:20px; text-align:center; font-size:20px; }
  .content { padding:30px; font-size:14px; color:#333; }
  .product-table { width:100%; border-collapse:collapse; margin-top:20px; }
  .product-table td { border-bottom:1px solid #eee; padding:15px 0; }
  .button {
    display:inline-block;
    padding:8px 16px;
    background:#111;
    color:#fff !important;
    text-decoration:none;
    border-radius:4px;
    font-size:13px;
  }
  .footer { padding:20px; text-align:center; font-size:12px; color:#888; background:#fafafa; }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    ¿Qué te han parecido tus productos?
  </div>

  <div class="content">

    <p>Hola <strong>{firstname} {lastname}</strong>,</p>

    <p>
      Tu pedido ya ha sido entregado y nos encantaría conocer tu opinión.
      Tu experiencia ayuda a otros clientes y nos permite mejorar.
    </p>

    <table class="product-table">
      {product_list}
    </table>

    <p style="margin-top:25px;">
      ¡Gracias por confiar en <strong>{shop_name}</strong>!
    </p>

  </div>

  <div class="footer">
    © {shop_name} — Este es un mensaje automático.
  </div>

</div>

</body>
</html>
